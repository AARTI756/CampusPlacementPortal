<div th:replace="~{header}"></div>
<h2>Add New Student</h2>
<form th:action="@{/students}" th:object="${student}" method="post" class="mt-3 w-50">
    <div class="mb-3">
        <label>Name</label>
        <input type="text" class="form-control" th:field="*{name}" required>
    </div>
    <div class="mb-3">
        <label>Email</label>
        <input type="email" class="form-control" th:field="*{email}" required>
    </div>
    <div class="mb-3">
        <label>Department</label>
        <input type="text" class="form-control" th:field="*{department}" required>
    </div>
    <div class="mb-3">
        <label>CGPA</label>
        <input type="number" step="0.01" class="form-control" th:field="*{cgpa}" required>
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <a href="/students" class="btn btn-secondary">Cancel</a>
</form>
<div th:replace="~{footer}"></div>
