<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Placement Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Theme Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body>
<nav class="navbar navbar-expand-lg custom-navbar sticky-top">
    <div class="container-fluid px-lg-4">
        <a class="navbar-brand" href="/">
            <div class="brand-icon-box">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <span>Placement Portal</span>
        </a>
        <button class="navbar-toggler border-secondary text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link" href="/"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/students"><i class="bi bi-people"></i> Students</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/companies"><i class="bi bi-building"></i> Companies</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/drives"><i class="bi bi-calendar2-event"></i> Placement Drives</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/applications"><i class="bi bi-briefcase"></i> Applications</a>
                </li>
            </ul>
            <div class="d-none d-lg-flex align-items-center gap-2">
                <span class="nav-portal-badge">
                    <i class="bi bi-check2-circle text-success me-1"></i>Production v1.0.0
                </span>
            </div>
        </div>
    </div>
</nav>

<main class="main-content">
<div class="container-fluid px-lg-4 py-4">

<!-- Flash messages -->
<div th:if="${message}" class="alert alert-success alert-dismissible fade show d-flex align-items-center shadow-sm" role="alert">
    <i class="bi bi-check-circle-fill fs-5 me-2 text-success"></i>
    <div th:text="${message}"></div>
    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center shadow-sm" role="alert">
    <i class="bi bi-exclamation-triangle-fill fs-5 me-2 text-danger"></i>
    <div th:text="${error}"></div>
    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
