<div th:replace="~{header}"></div>
<div class="d-flex justify-content-between align-items-center mt-3 mb-3">
    <h2>Students</h2>
    <form class="d-flex w-50" action="/students" method="get">
        <input class="form-control me-2" type="search" name="keyword" placeholder="Search by name or department" th:value="${keyword}">
        <button class="btn btn-outline-success" type="submit">Search</button>
        <a href="/students" class="btn btn-outline-secondary ms-2">Clear</a>
    </form>
    <a href="/students/new" class="btn btn-primary">Add Student</a>
</div>
<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>CGPA</th>
            <th>Placed</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.department}"></td>
            <td th:text="${student.cgpa}"></td>
            <td>
                <span th:if="${student.placed}" class="badge bg-success">Yes</span>
                <span th:unless="${student.placed}" class="badge bg-warning text-dark">No</span>
            </td>
        </tr>
    </tbody>
</table>
<div th:replace="~{footer}"></div>
