<div th:replace="~{header}"></div>

<div class="page-header-container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h2 class="page-header-title">Companies</h2>
            <p class="page-header-subtitle">Manage recruiting partners, participating corporate organizations, and industry sectors.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <a href="/companies/new" class="btn btn-primary">Add Company</a>
            <form action="/companies/delete/all" method="post" class="d-inline" onsubmit="return confirm('WARNING: This will delete ALL companies and their related drives/applications. Are you sure?');">
                <button type="submit" class="btn btn-outline-danger">Delete All</button>
            </form>
        </div>
    </div>
</div>

<div class="content-card">
    <div class="content-card-header">
        <form class="d-flex flex-grow-1" action="/companies" method="get" style="max-width: 580px;">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted">
                    <i class="bi bi-search"></i>
                </span>
                <input class="form-control border-start-0 ps-0" type="search" name="keyword" placeholder="Search companies by name..." th:value="${keyword}">
                <button class="btn btn-primary" type="submit">Search</button>
                <a href="/companies" class="btn btn-outline-secondary">Clear</a>
            </div>
        </form>
        <div class="text-muted small">
            <span>Registered Partners: </span>
            <strong class="text-dark" th:text="${companies != null ? companies.size() : 0}">0</strong>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table custom-table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th scope="col" style="width: 70px;">ID</th>
                    <th scope="col">Company Name</th>
                    <th scope="col" style="width: 200px;">Industry</th>
                    <th scope="col">Description</th>
                    <th scope="col" style="width: 120px;" class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${companies == null or companies.empty}">
                    <td colspan="5" class="text-center py-5 text-muted">
                        <i class="bi bi-building display-6 d-block mb-2 text-secondary opacity-50"></i>
                        <p class="mb-0 fw-semibold">No companies found in the portal.</p>
                        <small class="text-muted">Register a new recruiting partner to start organizing placement drives.</small>
                    </td>
                </tr>
                <tr th:each="company : ${companies}">
                    <td class="fw-bold text-secondary" th:text="${company.id}"></td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-light text-success d-inline-flex align-items-center justify-content-center me-2 fw-bold" style="width: 32px; height: 32px; font-size: 0.85rem; border: 1px solid #e2e8f0;">
                                <i class="bi bi-building"></i>
                            </div>
                            <span class="fw-semibold text-dark" th:text="${company.name}"></span>
                        </div>
                    </td>
                    <td>
                        <span class="badge bg-light text-primary border" th:text="${company.industry ?: 'Technology'}"></span>
                    </td>
                    <td class="text-muted small" th:text="${company.description}"></td>
                    <td class="text-end">
                        <form th:action="@{/companies/delete/{id}(id=${company.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this record?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{footer}"></div>
