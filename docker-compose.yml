services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: placement_db
      POSTGRES_USER: placement_user
      POSTGRES_PASSWORD: placement_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement_user -d placement_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
