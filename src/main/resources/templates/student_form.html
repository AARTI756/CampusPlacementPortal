<div th:replace="~{header}"></div>

<div class="page-header-container">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2 class="page-header-title">Add New Student</h2>
            <p class="page-header-subtitle">Register a new candidate in the campus placement database.</p>
        </div>
        <a href="/students" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Students
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
        <div class="form-card">
            <div class="form-card-header">
                <h5 class="fw-bold mb-1 text-dark">
                    <i class="bi bi-person-plus text-primary me-2"></i>Student Registration Details
                </h5>
                <p class="text-muted small mb-0">Fill in the required academic and contact information.</p>
            </div>

            <form th:action="@{/students}" th:object="${student}" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" id="name" class="form-control" th:field="*{name}" placeholder="e.g. Aarti Sakpal" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" th:field="*{email}" placeholder="e.g. student@college.edu" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="department" class="form-label">Department / Branch <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-mortarboard"></i></span>
                        <input type="text" id="department" class="form-control" th:field="*{department}" placeholder="e.g. Computer Engineering" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="cgpa" class="form-label">Cumulative GPA (CGPA) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-award"></i></span>
                        <input type="number" step="0.01" min="0" max="10" id="cgpa" class="form-control" th:field="*{cgpa}" placeholder="e.g. 8.85" required>
                    </div>
                    <div class="form-text">Enter CGPA on a scale of 0.00 to 10.00</div>
                </div>

                <div class="d-flex align-items-center justify-content-end gap-2 pt-2 border-top">
                    <a href="/students" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Save Student
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{footer}"></div>
