<div th:replace="~{header}"></div>
<div class="d-flex justify-content-between align-items-center mt-3 mb-3">
    <h2>Companies</h2>
    <form class="d-flex w-50" action="/companies" method="get">
        <input class="form-control me-2" type="search" name="keyword" placeholder="Search by name" th:value="${keyword}">
        <button class="btn btn-outline-success" type="submit">Search</button>
        <a href="/companies" class="btn btn-outline-secondary ms-2">Clear</a>
    </form>
    <div>
        <a href="/companies/new" class="btn btn-primary">Add Company</a>
        <form action="/companies/delete/all" method="post" class="d-inline" onsubmit="return confirm('WARNING: This will delete ALL companies and their related drives/applications. Are you sure?');">
            <button type="submit" class="btn btn-danger ms-2">Delete All</button>
        </form>
    </div>
</div>
<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Industry</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="company : ${companies}">
            <td th:text="${company.id}"></td>
            <td th:text="${company.name}"></td>
            <td th:text="${company.industry}"></td>
            <td th:text="${company.description}"></td>
            <td>
                <form th:action="@{/companies/delete/{id}(id=${company.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this record?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>
<div th:replace="~{footer}"></div>
