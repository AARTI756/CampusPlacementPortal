spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/placement_db?options=-c+TimeZone%3DUTC}
spring.datasource.username=${DB_USERNAME:placement_user}
spring.datasource.password=${DB_PASSWORD:placement_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true
