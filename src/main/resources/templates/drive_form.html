<div th:replace="~{header}"></div>

<div class="page-header-container">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2 class="page-header-title">Create Placement Drive</h2>
            <p class="page-header-subtitle">Schedule a new recruitment event and link it to an eligible company.</p>
        </div>
        <a href="/drives" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Drives
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
        <div class="form-card">
            <div class="form-card-header">
                <h5 class="fw-bold mb-1 text-dark">
                    <i class="bi bi-calendar2-plus text-primary me-2"></i>Drive Configuration
                </h5>
                <p class="text-muted small mb-0">Select a company, define the job role, minimum eligibility, and schedule the drive.</p>
            </div>

            <form th:action="@{/drives}" th:object="${drive}" method="post">
                <div class="mb-3">
                    <label class="form-label">Recruiting Company <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-building"></i></span>
                        <select class="form-select" th:field="*{company}" required>
                            <option value="">— Select a Company —</option>
                            <option th:each="comp : ${companies}" th:value="${comp.id}" th:text="${comp.name}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Job Role / Position <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-briefcase"></i></span>
                        <input type="text" class="form-control" th:field="*{jobRole}" placeholder="e.g. Software Engineer, Data Analyst" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Drive Date <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-calendar3"></i></span>
                            <input type="date" class="form-control" th:field="*{date}" required>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Minimum CGPA <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-award"></i></span>
                            <input type="number" step="0.01" min="0" max="10" class="form-control" th:field="*{minimumCgpa}" placeholder="e.g. 7.50" required>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Drive Status</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-flag"></i></span>
                        <select class="form-select" th:field="*{status}">
                            <option value="UPCOMING">UPCOMING</option>
                            <option value="ONGOING">ONGOING</option>
                            <option value="COMPLETED">COMPLETED</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-end gap-2 pt-2 border-top">
                    <a href="/drives" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Save Drive
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{footer}"></div>
