<div th:replace="~{header}"></div>
<div class="d-flex justify-content-between align-items-center mt-3 mb-3">
    <h2>Placement Drives</h2>
    <div>
        <a href="/drives/new" class="btn btn-primary">Create Drive</a>
        <form action="/drives/delete/all" method="post" class="d-inline" onsubmit="return confirm('WARNING: This will delete ALL drives and their related applications. Are you sure?');">
            <button type="submit" class="btn btn-danger ms-2">Delete All</button>
        </form>
    </div>
</div>
<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>ID</th>
            <th>Company</th>
            <th>Job Role</th>
            <th>Date</th>
            <th>Min CGPA</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="drive : ${drives}">
            <td th:text="${drive.id}"></td>
            <td th:text="${drive.company.name}"></td>
            <td th:text="${drive.jobRole}"></td>
            <td th:text="${drive.date}"></td>
            <td th:text="${drive.minimumCgpa}"></td>
            <td th:text="${drive.status}"></td>
            <td>
                <form th:action="@{/drives/delete/{id}(id=${drive.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this record?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>
<div th:replace="~{footer}"></div>
