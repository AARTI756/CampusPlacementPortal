<div th:replace="~{header}"></div>

<div class="page-header-container">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2 class="page-header-title">Add New Company</h2>
            <p class="page-header-subtitle">Register an employer or corporate partner for campus recruitment.</p>
        </div>
        <a href="/companies" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Companies
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
        <div class="form-card">
            <div class="form-card-header">
                <h5 class="fw-bold mb-1 text-dark">
                    <i class="bi bi-building-add text-primary me-2"></i>Company Information
                </h5>
                <p class="text-muted small mb-0">Enter the organization profile and sector classification.</p>
            </div>

            <form th:action="@{/companies}" th:object="${company}" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Company Name <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-building"></i></span>
                        <input type="text" id="name" class="form-control" th:field="*{name}" placeholder="e.g. Tata Consultancy Services" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="industry" class="form-label">Industry / Sector</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-briefcase"></i></span>
                        <input type="text" id="industry" class="form-control" th:field="*{industry}" placeholder="e.g. Information Technology / Cloud Services">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label">Company Description / Overview</label>
                    <textarea id="description" class="form-control" rows="4" th:field="*{description}" placeholder="Brief overview of hiring requirements, domains, or eligibility criteria..."></textarea>
                </div>

                <div class="d-flex align-items-center justify-content-end gap-2 pt-2 border-top">
                    <a href="/companies" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Save Company
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{footer}"></div>
